name: 每日更新新闻数据

on:
  schedule:
    # GitHub Actions 使用 UTC；以下对应北京时间 07:00 / 12:00 / 19:00
    - cron: '0 23 * * *'
    - cron: '0 4 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取并生成 news.json
        run: node scripts/fetch-news.mjs
        env:
          TZ: Asia/Shanghai

      - name: 同步生成离线单文件快照
        run: node scripts/build-offline.mjs

      - name: 提交数据变更（推送后 GitHub Pages 自动重建）
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json news-offline.html
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新新闻数据 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
