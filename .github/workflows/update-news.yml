name: 每日更新新闻数据

on:
  schedule:
    # GitHub Actions 使用 UTC；以下对应北京时间 07:00 / 12:00 / 19:00
    - cron: '0 23 * * *'
    - cron: '0 4 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取并生成 news.json
        run: node scripts/fetch-news.mjs
        env:
          TZ: Asia/Shanghai

      - name: 提交数据变更
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新新闻数据 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: 触发 Cloudflare Pages 重新部署
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" && echo "已触发 Pages 部署"
          else
            echo "未配置 Deploy Hook，依赖 Pages 的 Git 推送自动部署"
          fi
