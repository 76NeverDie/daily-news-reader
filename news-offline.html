:root{

}
@media (prefers-color-scheme: dark){

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
header.top{background:var(--surface);border-bottom:1px solid var(--border)}
.top-inner{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--active);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:500;flex:0 0 auto}
.brand h1{font-size:16px;font-weight:500;margin:0;line-height:1.3}
.brand p{font-size:11.5px;color:var(--faint);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.meta-row{display:flex;align-items:center;gap:10px}
.powered{font-size:11.5px;color:var(--faint);white-space:nowrap;line-height:1.3}
.powered .heart{color:var(--heart)}
#updated{font-size:11.5px;color:var(--faint);white-space:nowrap}
button{font-family:inherit}
#refresh{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
#refresh:hover{border-color:var(--accent);color:var(--accent)}
#refresh:disabled{opacity:.55;cursor:default}
.notice{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-text);border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.7;margin-top:16px}
.notice[hidden]{display:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:18px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:7px 14px;border-radius:999px;font-size:12.5px;cursor:pointer;white-space:nowrap}

.tools{display:flex;align-items:center;gap:12px;margin-bottom:2px}
#search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--text);outline:none}

#count{font-size:11.5px;color:var(--faint);white-space:nowrap}

.hot-source{font-size:11.5px;color:var(--faint);padding:10px 16px 4px}
.hot-item{display:flex;align-items:center;gap:10px;padding:6px 16px}
.hot-item:hover{background:var(--bg)}
.hot-rank{flex:0 0 20px;text-align:center;font-size:12px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.hot-item[data-top="1"] .hot-rank{color:#d64b4b}
.hot-item[data-top="2"] .hot-rank{color:#dd8033}
.hot-item[data-top="3"] .hot-rank{color:#c99a2e}
.hot-title{flex:1;min-width:0;font-size:13.5px;color:var(--text);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hot-title:hover{color:var(--accent)}
.hot-value{flex:0 0 auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.card h2{font-size:16px;line-height:1.5;font-weight:500;margin:0 0 8px;color:var(--text)}
.card h2 a{color:inherit;text-decoration:none}
.card h2 a:hover{color:var(--accent)}
.card p{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 11px}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11.5px;color:var(--faint)}
.read-more{color:var(--accent);text-decoration:none;white-space:nowrap}
.read-more:hover{text-decoration:underline}
.empty{padding:48px 16px;text-align:center;color:var(--faint);font-size:13px;line-height:1.8}
footer{margin:36px 0 40px;padding-top:18px;border-top:1px solid var(--border);font-size:11.5px;line-height:1.9;color:var(--faint)}
@media (max-width:600px){

  .brand p{display:none}

  .card{padding:14px 15px}

  .hot-item{padding:6px 12px;gap:8px}
  .hot-source{padding:10px 12px 4px}
  .hot-title{font-size:13px}

(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var SOURCE_LABEL = {
    xuexi: '学习强国', people: '人民日报', bloomberg: 'Bloomberg',
    baidu: '百度热搜', weibo: '微博热搜'
  };
  var state = { data: null, filter: 'all', q: '' };

  function safeUrl(u) {
    try {
      var x = new URL(u, location.href);
      return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : '';
    } catch (e) { return ''; }
  }

  function fmtUpdated(iso) {
    if (!iso) return '—';
    try {
      return new Date(iso).toLocaleString('zh-CN', {
        timeZone: 'Asia/Shanghai', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false
      });
    } catch (e) { return iso; }
  }

  function fmtHot(n) {
    if (!Number.isFinite(n) || n <= 0) return '';
    if (n >= 10000) {
      var v = n / 10000;
      return (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10) + '万';
    }
    return String(n);
  }

  function dayLabel(date, today) {
    if (!date || date === '未知') return '日期未知';
    var md = date.slice(5).replace('-', '月') + '日';
    if (date === today) return '今天 · ' + md;
    try {
      var diff = Math.round((Date.parse(today + 'T00:00:00Z') - Date.parse(date + 'T00:00:00Z')) / 86400000);
      if (diff === 1) return '昨天 · ' + md;
      if (diff > 1) return date.slice(0, 4) + '年' + md + '（较早内容）';
    } catch (e) { /* 保持原日期 */ }
    return md;
  }

  function buildCard(it) {
    var card = document.createElement('article');
    card.className = 'card';

    var top = document.createElement('div');
    top.className = 'card-top';
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.dataset.source = it.source;
    tag.textContent = SOURCE_LABEL[it.source] || it.source || '其他';
    top.appendChild(tag);
    if (it.channel) {
      var ch = document.createElement('span');
      ch.className = 'channel';
      ch.textContent = it.channel;
      top.appendChild(ch);
    }
    card.appendChild(top);

    var href = safeUrl(it.url);
    var h = document.createElement('h2');
    if (href) {
      var a = document.createElement('a');
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = it.title || '（无标题）';
      h.appendChild(a);
    } else {
      h.textContent = it.title || '（无标题）';
    }
    card.appendChild(h);

    if (it.summary) {
      var p = document.createElement('p');
      p.textContent = it.summary;
      card.appendChild(p);
    }

    var foot = document.createElement('div');
    foot.className = 'card-foot';
    var date = document.createElement('span');
    date.textContent = it.date || '';
    foot.appendChild(date);
    if (href) {
      var more = document.createElement('a');
      more.className = 'read-more';
      more.href = href;
      more.target = '_blank';
      more.rel = 'noopener noreferrer';
      more.textContent = '阅读原文 ↗';
      foot.appendChild(more);
    }
    card.appendChild(foot);
    return card;
  }

  function renderNotice() {
    var box = $('#notice');
    box.replaceChildren();
    var bad = state.data.sources.filter(function (s) { return s.status && s.status !== 'ok'; });
    if (!bad.length) { box.hidden = true; return; }
    box.hidden = false;
    bad.forEach(function (s) {
      var label = s.status === 'stale' ? '沿用上次抓取数据' : (s.status === 'error' ? '本次暂无数据' : '数据源降级');
      var row = document.createElement('div');
      row.textContent = s.name + ' · ' + label + '：' + (s.error || '本次未获得新内容');
      box.appendChild(row);
    });
  }

  function renderTabs() {
    var box = $('#tabs');
    box.replaceChildren();
    var newsTotal = state.data.items.filter(function (it) { return it.kind !== 'hot'; }).length;
    var defs = [{ id: 'all', name: '全部', count: newsTotal }];
    state.data.sources.forEach(function (s) {
      defs.push({ id: s.id, name: s.name, count: s.count });
    });
    defs.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab';
      b.dataset.id = t.id;
      b.textContent = t.name + ' ' + t.count;
      b.setAttribute('aria-selected', String(t.id === state.filter));
      b.addEventListener('click', function () {
        state.filter = t.id;
        Array.prototype.forEach.call(box.children, function (el) {
          el.setAttribute('aria-selected', String(el.dataset.id === t.id));
        });
        renderList();
      });
      box.appendChild(b);
    });
  }

  function renderHotBlock(rows) {
    var wrap = document.createElement('section');
    wrap.className = 'hot-group';
    var head = document.createElement('div');
    head.className = 'hot-head';
    head.textContent = '实时热搜榜 · 快照 ' + fmtUpdated(state.data.generatedAt);
    wrap.appendChild(head);

    state.data.sources.forEach(function (s) {
      var list = rows.filter(function (it) { return it.source === s.id; })
        .sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); });
      if (!list.length) return;
      var panel = document.createElement('div');
      panel.className = 'hot-panel';
      var cap = document.createElement('div');
      cap.className = 'hot-source';
      cap.textContent = (SOURCE_LABEL[s.id] || s.name) + ' · ' + list.length + ' 条';
      panel.appendChild(cap);
      list.forEach(function (it) {
        var row = document.createElement('div');
        row.className = 'hot-item';
        row.dataset.top = String(it.rank <= 3 ? it.rank : 0);
        var rank = document.createElement('span');
        rank.className = 'hot-rank';
        rank.textContent = it.rank || '·';
        row.appendChild(rank);
        var a = document.createElement('a');
        a.className = 'hot-title';
        var href = safeUrl(it.url);
        if (href) {
          a.href = href;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }
        a.textContent = it.title || '（无标题）';
        row.appendChild(a);
        var hot = fmtHot(it.hot);
        if (hot) {
          var v = document.createElement('span');
          v.className = 'hot-value';
          v.textContent = hot;
          row.appendChild(v);
        }
        panel.appendChild(row);
      });
      wrap.appendChild(panel);
    });
    return wrap;
  }

  function renderList() {
    var q = state.q.trim().toLowerCase();
    var rows = state.data.items.filter(function (it) {
      var isHot = it.kind === 'hot';
      // 「全部」只展示新闻；热搜仅在各自的专属标签中展示
      if (state.filter === 'all') {
        if (isHot) return false;
      } else if (it.source !== state.filter) {
        return false;
      }
      if (!q) return true;
      return ((it.title || '') + ' ' + (it.summary || '') + ' ' + (it.channel || '')).toLowerCase().indexOf(q) >= 0;
    });
    $('#count').textContent = '共 ' + rows.length + ' 条';

    var box = $('#list');
    box.replaceChildren();
    if (!rows.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '没有匹配的条目，换个关键词或来源试试。';
      box.appendChild(empty);
      return;
    }

    var hots = rows.filter(function (it) { return it.kind === 'hot'; });
    var news = rows.filter(function (it) { return it.kind !== 'hot'; });
    if (hots.length) box.appendChild(renderHotBlock(hots));

    var groups = new Map();
    news.forEach(function (it) {
      var k = it.date || '未知';
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(it);
    });
    groups.forEach(function (items, date) {
      var sec = document.createElement('section');
      sec.className = 'day-group';
      var title = document.createElement('div');
      title.className = 'day-title';
      title.textContent = dayLabel(date, state.data.date);
      sec.appendChild(title);
      items.forEach(function (it) { sec.appendChild(buildCard(it)); });
      box.appendChild(sec);
    });
  }

  async function load() {
    var btn = $('#refresh');
    btn.disabled = true;
    btn.textContent = '刷新中…';
    var box = $('#list');
    box.replaceChildren();
    var loading = document.createElement('div');
    loading.className = 'empty';
    loading.textContent = '正在加载新闻…';
    box.appendChild(loading);
    try {
      var data = EMBEDDED_NEWS;
      if (!data || !Array.isArray(data.items) || !Array.isArray(data.sources)) throw new Error('数据格式不正确');
      state.data = data;
      $('#updated').textContent = '更新于 ' + fmtUpdated(data.generatedAt);
      renderNotice();
      renderTabs();
      renderList();
    } catch (e) {
      box.replaceChildren();
      var err = document.createElement('div');
      err.className = 'empty';
      err.textContent = '数据加载失败：' + e.message + '。请确认 data/news.json 已生成，或稍后点击刷新重试。';
      box.appendChild(err);
      $('#updated').textContent = '加载失败';
    } finally {
      btn.disabled = false;
      btn.textContent = '刷新';
    }
  }

  $('#search').addEventListener('input', function (e) {
    state.q = e.target.value;
    if (state.data) renderList();
  });
  $('#refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
